services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: linku-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    container_name: linku-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://linku:linku_password@db:5432/linku_db?schema=public
      PORT: 5000
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: linku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linku
      POSTGRES_PASSWORD: linku_password
      POSTGRES_DB: linku_db
    ports:
      - "5432:5432"
    volumes:
      - linku_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linku -d linku_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  linku_postgres_data:
